[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recapi"
version = "0.1.0"
description = "Flask REST API for storing, editing and searching recipes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Anne Schumacher Olsson", email = "anne.schumacher.up@gmail.com" }
]
dependencies = [
    "bleach==6.4.0",
    "bleach-whitelist==0.0.11",
    "click==8.4.2",
    "flask==3.1.3",
    "flask-session==0.8.0",
    "flask-cors==6.0.5",
    "gunicorn==26.0.0",
    "markdown==3.10.3",
    "bs4==0.0.2",
    "requests==2.34.2",
    "validator-collection==1.5.0",
    "html2text==2025.4.15",
    "peewee==4.3.0",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "pymysql==1.2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright>=1.1.411",
]

[tool.ruff]
line-length = 120
output-format = "grouped"

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "COM",    # flake8-commas
    "D",      # pydocstyle
    "missing-trailing-period",   # pydocstyle
    "non-imperative-mood",   # pydocstyle
    "E",      # pycodestyle: errors
    "F",      # Pyflakes
    "FLY",    # flynt
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle: warnings
]
ignore = [
    "any-type",  # flake8-annotations
    "function-call-in-default-argument",  # flake8-bugbear
    "missing-trailing-comma",  # flake8-commas
    "ambiguous-variable-name",  # pycodestyle
    "PLR09",  # Pylint: too-many-*
    "too-many-nested-blocks",  # Pylint
    "suppressible-exception",  # flake8-simplify
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "standard"
include = ["sparv", "tests"]

[project.scripts]
recapi = "recapi.__main__:main"
recapi-user-cli = "recapi.user_cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["recapi*"]

[tool.setuptools.package-data]
recapi = ["static/*", "templates/*.html"]
